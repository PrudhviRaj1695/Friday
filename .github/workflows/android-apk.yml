name: Build FRIDAY Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'windows-worker/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v4 no longer requests Google's retired "tools" SDK package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Sherpa ONNX Android runtime
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" -o app/libs/sherpa-onnx-2.0.1.aar
          echo "Sherpa ONNX AAR: $(du -h app/libs/sherpa-onnx-2.0.1.aar)"

      - name: Windows worker tests (fake Ollama)
        run: |
          python -m pip install -r windows-worker/requirements.txt -r windows-worker/requirements-dev.txt
          cd windows-worker && python -m pytest -q tests

      - name: Android unit tests (voice pipeline, command routing, config, worker client)
        run: gradle --no-daemon testDebugUnitTest

      - name: Android client <-> real worker end-to-end test
        run: PYTHON=python GRADLE=gradle windows-worker/tests/run_e2e.sh

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Print APK signing SHA-1 for Google OAuth setup
        run: gradle --no-daemon :app:signingReport

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-test-reports
          path: app/build/reports/tests/
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friday-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ui-tests:
    # Compose UI tests (command center, conversation, settings, Telugu rendering, small/large layouts)
    # on an x86_64 emulator. Screenshots are uploaded as an artifact for review.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download Sherpa ONNX Android runtime
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" -o app/libs/sherpa-onnx-2.0.1.aar
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.friday.app/files/ui-screenshots ui-screenshots || true
      - name: Upload UI screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-ui-test-results
          path: |
            ui-screenshots/
            app/build/reports/androidTests/
          retention-days: 14
