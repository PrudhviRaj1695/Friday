name: FRIDAY Worker Tests

on:
  push:
    branches: ["**"]
    paths:
      - "windows-worker/**"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    paths:
      - "windows-worker/**"
      - ".github/workflows/worker-tests.yml"

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows-worker/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile worker
        run: python -m compileall -q .
      - name: Run unit tests
        run: pytest -q
